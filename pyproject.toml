[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-hired-now"
version = "0.1.0"
description = "Evidence-grounded job-search workflow with explicit state and human gates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Get-Hired-NOW contributors"}]
dependencies = []

[project.scripts]
get-hired-now = "get_hired_now.cli:main"

[tool.setuptools.packages.find]
include = ["get_hired_now*"]
